name: Deploy website
on:
  push:
    branches: [main, latest-updates-staging]
  workflow_dispatch:
concurrency:
  group: website-${{ github.ref_name }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    if: (github.ref_name == 'main' && vars.UPDATES_DEPLOY_ENABLED == 'true') || (github.ref_name == 'latest-updates-staging' && vars.UPDATES_STAGING_DEPLOY_ENABLED == 'true')
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19
      - id: revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq .object.sha)
          if [ "$current" = "$GITHUB_SHA" ]; then echo "current=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.revision.outputs.current == 'true'
        run: bun install --frozen-lockfile && bun run updates:validate && bunx astro check && bun run build
      - name: Deploy intended current revision
        if: steps.revision.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq .object.sha)
          if [ "$current" != "$GITHUB_SHA" ]; then exit 0; fi
          bunx wrangler pages deploy dist --project-name ekselera --branch "$GITHUB_REF_NAME" --commit-hash "$GITHUB_SHA"
